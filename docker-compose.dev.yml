services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CARECALL_MAX_LIVE_BATCH_SIZE: "${CARECALL_MAX_LIVE_BATCH_SIZE:-1}"
      CARECALL_BACKEND_API_TOKEN: "${CARECALL_BACKEND_API_TOKEN:-carecall-local-backend-token}"
      CARECALL_DB_PATH: "/app/runtime/carecall.sqlite3"
      CARECALL_CALLE_PROVIDER: "${CARECALL_CALLE_PROVIDER:-api}"
      CARECALL_CALLE_API_KEY: "${CARECALL_CALLE_API_KEY:-}"
      CARECALL_CALLE_API_BASE_URL: "${CARECALL_CALLE_API_BASE_URL:-https://api.heycall-e.com}"
      CARECALL_CALLE_REGION: "${CARECALL_CALLE_REGION:-GB}"
      CARECALL_CALLE_TIMEOUT_SECONDS: "${CARECALL_CALLE_TIMEOUT_SECONDS:-45}"
    ports:
      - "8000:8000"
    volumes:
      - carecall_runtime:/app/runtime

volumes:
  carecall_runtime:
